<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom PC Build Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }

body {
  margin: 0;
  background: black;
  color: white;
  overflow-x: hidden;
}

.circle {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.6;
  animation: float 30s infinite alternate;
  z-index: 0;
}

@keyframes float {
  from { transform: translateY(0px); }
  to { transform: translateY(-200px); }
}

.container {
  position: relative;
  z-index: 2;
  max-width: 900px;
  margin: auto;
  padding: 2rem;
}

.section {
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 2rem;
}

h2 { margin-top: 0; }

select, input, textarea {
  width: 100%;
  margin-top: 0.5rem;
  padding: 0.6rem;
  border-radius: 8px;
  border: none;
  font-size: 1rem;
}

select[multiple] {
  height: 180px;
}

.other-input {
  display: none;
  margin-top: 0.5rem;
}

textarea {
  min-height: 120px;
  resize: vertical;
}
</style>
</head>

<body>

<!-- ===== BACKGROUND CIRCLES ===== -->
<script>
for (let i = 0; i < 18; i++) {
  const c = document.createElement('div');
  c.className = 'circle';
  c.style.width = c.style.height = Math.random()*300 + 200 + 'px';
  c.style.background = `hsla(${Math.random()*360},70%,60%,0.6)`;
  c.style.top = Math.random()*100 + 'vh';
  c.style.left = Math.random()*100 + 'vw';
  document.body.appendChild(c);
}
</script>

<div class="container">

<!-- ===== $100 SECTION ===== -->
<div class="section">
<h2>$100 – Full Parts Selection</h2>

<!-- CPU -->
<label>CPU (Select all acceptable options)</label>
<select id="cpu" multiple>
  <optgroup label="Intel">
    <option>i9 (13th–14th Gen)</option>
    <option>i7 (12th–14th Gen)</option>
    <option>i5 (11th–14th Gen)</option>
    <option>i3 (12th–14th Gen)</option>
  </optgroup>
  <optgroup label="AMD">
    <option>Ryzen 9 (7000)</option>
    <option>Ryzen 7 (7000 / 5000)</option>
    <option>Ryzen 5 (7000 / 5000)</option>
    <option>Ryzen 3</option>
  </optgroup>
  <option>Other / Not Listed</option>
</select>
<input id="cpu-other" class="other-input" placeholder="Please list the CPU you want">

<!-- GPU -->
<label>GPU (Select all acceptable options)</label>
<select id="gpu" multiple>
  <optgroup label="NVIDIA RTX 50 Series">
    <option>RTX 5050</option>
    <option>RTX 5060</option>
    <option>RTX 5070</option>
    <option>RTX 5080</option>
    <option>RTX 5090</option>
  </optgroup>
  <optgroup label="RTX 40 Series">
    <option>RTX 4060</option>
    <option>RTX 4070</option>
    <option>RTX 4080</option>
    <option>RTX 4090</option>
  </optgroup>
  <optgroup label="AMD Radeon">
    <option>RX 7600</option>
    <option>RX 7700 XT</option>
    <option>RX 7800 XT</option>
    <option>RX 7900 XT</option>
    <option>RX 7900 XTX</option>
  </optgroup>
  <option>Other / Not Listed</option>
</select>
<input id="gpu-other" class="other-input" placeholder="Please list the GPU you want">

<!-- RAM -->
<label>RAM</label>
<select id="ram">
  <option>8GB DDR4 (1x8)</option>
  <option>16GB DDR4 (2x8)</option>
  <option>32GB DDR4 (2x16)</option>
  <option>16GB DDR5 (2x8)</option>
  <option>32GB DDR5 (2x16)</option>
  <option>64GB DDR5 (2x32)</option>
  <option>128GB DDR5 (4x32)</option>
  <option>Other / Not Listed</option>
</select>
<input id="ram-other" class="other-input" placeholder="Please list your RAM configuration">

<!-- STORAGE -->
<label>Primary SSD</label>
<select id="ssd-primary">
  <option>256GB</option>
  <option>512GB</option>
  <option>1TB</option>
  <option>2TB</option>
  <option>4TB</option>
  <option>8TB</option>
  <option>Other / Not Listed</option>
</select>
<input id="ssd-other" class="other-input" placeholder="Please list primary storage">

<label>Secondary SSD (Optional)</label>
<select id="ssd-secondary">
  <option>N/A</option>
  <option>512GB</option>
  <option>1TB</option>
  <option>2TB</option>
  <option>4TB</option>
  <option>Other / Not Listed</option>
</select>
<input id="ssd-secondary-other" class="other-input" placeholder="Please list secondary storage">

<!-- CASE / PSU / COOLING -->
<label>PC Case</label>
<input placeholder="Type desired case">

<label>CPU Cooling</label>
<input placeholder="Air or Liquid (model if known)">

<label>Case Fans</label>
<input placeholder="Number / brand / RGB preference">

<label>Power Supply</label>
<select>
  <option>600W</option>
  <option>750W</option>
  <option>850W</option>
  <option>1000W</option>
  <option>1200W</option>
  <option>1600W</option>
  <option>2000W</option>
</select>

<!-- PERIPHERALS -->
<label>Peripherals (Keyboard, Mouse, Monitor, etc.)</label>
<textarea placeholder="List any peripherals you want included"></textarea>

<label>Other Components / Notes</label>
<textarea placeholder="WiFi cards, capture cards, aesthetic requests, etc."></textarea>

</div>
</div>

<!-- ===== OTHER / NOT LISTED LOGIC ===== -->
<script>
function handleOther(selectId, inputId, isMulti = false) {
  const select = document.getElementById(selectId);
  const input = document.getElementById(inputId);

  select.addEventListener('change', () => {
    let show = false;

    if (isMulti) {
      show = [...select.selectedOptions].some(o => o.text === 'Other / Not Listed');
    } else {
      show = select.value === 'Other / Not Listed';
    }

    input.style.display = show ? 'block' : 'none';
    if (!show) input.value = '';
  });
}

handleOther('cpu', 'cpu-other', true);
handleOther('gpu', 'gpu-other', true);
handleOther('ram', 'ram-other');
handleOther('ssd-primary', 'ssd-other');
handleOther('ssd-secondary', 'ssd-secondary-other');
</script>

</body>
</html>
