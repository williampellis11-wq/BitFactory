<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BitFactory PCs</title>

<style>
/* ===== BASE ===== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: #000;
  overflow-x: hidden;
}

header {
  background: #1a73e8;
  color: black;
  text-align: center;
  padding: 2.5rem;
}

section {
  max-width: 900px;
  margin: 2rem auto;
  background: white;
  padding: 2rem;
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  position: relative;
  z-index: 2;
}

h2 {
  color: #1a73e8;
}

label {
  display: block;
  margin-top: 1rem;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 0.6rem;
  margin-top: 0.3rem;
  border-radius: 8px;
  border: 1px solid #ccc;
}

textarea {
  resize: vertical;
}

/* ===== BACKGROUND CIRCLES ===== */
.circle {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  animation: pulse 12s infinite alternate;
  z-index: 0;
}

@keyframes pulse {
  from { opacity: 0.4; }
  to { opacity: 0.8; }
}

/* Disable circles on mobile */
@media (max-width: 768px) {
  .circle { display: none; }
  body { background: black; }
}
</style>
</head>

<body>

<header>
  <h1>BitFactory PCs</h1>
  <p>Custom PC Building Services</p>
</header>

<!-- ================= $100 BUILD ================= -->
<section>
<h2>$100 – Build Your Parts</h2>

<label>CPU</label>
<select id="cpu">
  <option>Intel i9</option>
  <option>Intel i7</option>
  <option>Intel i5</option>
  <option>AMD Ryzen 9</option>
  <option>AMD Ryzen 7</option>
  <option>AMD Ryzen 5</option>
  <option value="other">Other / Not Listed</option>
</select>
<textarea id="cpuOther" placeholder="Please list CPU" style="display:none;"></textarea>

<label>GPU</label>
<select id="gpu">
  <option>NVIDIA RTX 5050</option>
  <option>NVIDIA RTX 5060</option>
  <option>NVIDIA RTX 5070</option>
  <option>NVIDIA RTX 5080</option>
  <option>NVIDIA RTX 5090</option>
  <option>AMD RX 6000 Series</option>
  <option value="other">Other / Not Listed</option>
</select>
<textarea id="gpuOther" placeholder="Please list GPU" style="display:none;"></textarea>

<label>RAM</label>
<select id="ram">
  <option>8GB DDR4</option>
  <option>16GB DDR4</option>
  <option>32GB DDR4</option>
  <option>32GB DDR5</option>
  <option>64GB DDR5</option>
  <option value="other">Other / Not Listed</option>
</select>
<textarea id="ramOther" placeholder="Please list RAM" style="display:none;"></textarea>

<label>Primary SSD</label>
<select id="ssd1">
  <option>256GB</option>
  <option>512GB</option>
  <option>1TB</option>
  <option>2TB</option>
  <option>4TB</option>
  <option>8TB</option>
  <option value="other">Other / Not Listed</option>
</select>
<textarea id="ssd1Other" placeholder="Please list SSD" style="display:none;"></textarea>

<label>Secondary SSD</label>
<select>
  <option>N/A</option>
  <option>512GB</option>
  <option>1TB</option>
  <option>2TB</option>
  <option>4TB</option>
</select>

<label>Case</label>
<input placeholder="Type case name">

<label>Power Supply (600W–2000W)</label>
<select>
  <option>600W</option><option>750W</option><option>850W</option>
  <option>1000W</option><option>1200W</option><option>1600W</option><option>2000W</option>
</select>

<label>Cooling</label>
<input placeholder="Air / AIO / Custom Loop">

<label>Case Fans</label>
<input placeholder="Fan model or quantity">

<label>Peripherals</label>
<textarea placeholder="Keyboard, mouse, monitor, etc"></textarea>

<label>Other Components / Notes</label>
<textarea></textarea>
</section>

<!-- ================= $150 ================= -->
<section>
<h2>$150 – Parts Research</h2>
<label>Budget ($)</label>
<input type="number">

<label>Peripherals</label>
<textarea></textarea>

<label>Other Components / Notes</label>
<textarea></textarea>
</section>

<!-- ================= $200 ================= -->
<section>
<h2>$200 – Target FPS Build</h2>
<label>Budget ($)</label>
<input type="number">

<label>Target FPS</label>
<input type="number">

<label>Games Played</label>
<textarea></textarea>

<label>Peripherals</label>
<textarea></textarea>

<label>Other Notes</label>
<textarea></textarea>
</section>

<!-- ================= $250 ================= -->
<section>
<h2>$250 – FPS + Workstation</h2>
<label>Budget ($)</label>
<input type="number">

<label>Target FPS</label>
<input type="number">

<label>Games Played</label>
<textarea></textarea>

<label>Productivity / Workstation Apps</label>
<textarea placeholder="Premiere, Blender, CAD, coding, etc"></textarea>

<label>Peripherals</label>
<textarea></textarea>

<label>Other Notes</label>
<textarea></textarea>
</section>

<!-- ================= SUBMIT ================= -->
<section>
<h2>Submit Build</h2>
<label>Name</label>
<input>

<label>Email</label>
<input type="email">

<button style="margin-top:1rem;padding:1rem;font-size:1.1rem;
background:#1a73e8;color:white;border:none;border-radius:12px;">
Submit Request
</button>
</section>

<!-- ===== LOGIC ===== -->
<script>
function toggle(selectId, textareaId){
  document.getElementById(selectId).addEventListener('change', e=>{
    document.getElementById(textareaId).style.display =
      e.target.value === 'other' ? 'block' : 'none';
  });
}
toggle('cpu','cpuOther');
toggle('gpu','gpuOther');
toggle('ram','ramOther');
toggle('ssd1','ssd1Other');

// Background circles
if (window.innerWidth > 768) {
  for(let i=0;i<18;i++){
    const c=document.createElement('div');
    c.className='circle';
    const s=Math.random()*300+150;
    c.style.width=c.style.height=s+'px';
    c.style.background=`hsla(${Math.random()*360},70%,60%,0.6)`;
    c.style.filter=`blur(${Math.random()*100+80}px)`;
    c.style.top=Math.random()*100+'vh';
    c.style.left=Math.random()*100+'vw';
    document.body.appendChild(c);
  }
}
</script>

</body>
</html>
